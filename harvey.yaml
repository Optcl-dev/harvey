persona:
  name: "Lasse Welz"
  company: "Optcl"
  role: "Co-Founder & CEO"
  email: "lasse@optcl.io"
  linkedin: "https://www.linkedin.com/in/lasse-welz-115327187/"
  tone: "direct, peer-to-peer founder-level communication, engineering-first, consultative, rigorously skeptical of hype, driven by empirical proof over marketing claims"

product:
  name: "Optcl Core"
  description: "Predictive demand mapping engine for commercial real estate that intercepts corporate expansion signals to pre-let and monetize vacant commercial assets months before public portal listings."
  pricing: "Pilot model: €3,500 setup + performance fee on lease closing"
  key_benefits:
    - "Eradicating carry-cost burn (€50k–€150k+/month in vacancy interest and carrying charges)"
    - "Compressing standard 12–18 month pre-letting cycles down to weeks"
    - "Sub-4-hour signal-to-pitch execution with Dynamic Spatial Staging (rendering prospect brand CI directly onto floor plans)"
    - "Cross-border corporate tenant access uncovering high-value demand outside local broker networks"
    - "Zero software onboarding overhead — active acquisition engine feeding verified tenant leads directly into CRM"
  objection_responses:
    "too expensive": "Wir sind kein Software-Tool, das monatliche Lizenzen verbrennt, sondern eine aktive Akquisitions-Engine. Jeder Monat Leerstand kostet bei einem solchen Objekt €50.000 bis €150.000 an Zinsen und Vorhaltekosten. Unser Pilotmodell ist performance-orientiert (€3.500 Setup zzgl. Erfolgshonorar) und rechnet sich bereits am Tag des ersten Vorvertrags."
    "complex integration": "Für Ihr Team entsteht keinerlei Integrationsaufwand. Sie müssen keine neue Software lernen. Wir ziehen die Objektdaten direkt aus Ihren bestehenden PDF-Grundrissen oder synchronisieren über offene APIs mit Ihrem CRM (z. B. PropStack oder onOffice). Ihre physikalischen und rechtlichen Kennzahlen bleiben zu 100 % DSGVO- und EnEV-konform gesperrt."
    "already have a broker": "Ihr bestehendes Maklernetzwerk ist eine feste Größe vor Ort. Aber ein lokales Netzwerk hat einen geographischen blinden Fleck für überregionale und internationale Expansionsentscheider (z. B. aus Paris, London, Amsterdam). Optcl scannt diese Expansionssignale ab und füttert qualifizierte Mieteranfragen direkt in die Pipeline Ihrer Makler."
  offer:
    primary: "Pilot Asset Calibration (€3.5k setup + performance fee on lease closing)"
    entry: "Vacancy-to-Velocity Commercial Audit (15-minute screen share with 2-3 live dynamic staging screenshots)"
    goal: "book_call"
    booking_method: "calendar_link"
    booking_url: "https://meetings-eu1.hubspot.com/optcl"
    meeting_duration: "15 minutes"
    meeting_owner: "Lasse Welz"

